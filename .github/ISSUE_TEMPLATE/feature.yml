name: Feature request
description: Propose a focused improvement to the guardrail engine or its documentation.
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What safety or integration problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Security and privacy risks
      description: Include possible bypasses, false positives, and migration concerns.
    validations:
      required: true
